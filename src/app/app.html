<!-- ================= DESKTOP & TOP NAVIGATION BAR ================= -->
<nav
  class="relative w-full bg-playsync-surface/95 backdrop-blur-md border-b border-playsync-border font-['Inter',sans-serif] select-none text-playsync-text shadow-sm"
>
  @if (loadingService.isLoading()) {
    <div class="absolute bottom-0 left-0 right-0 h-0.5 overflow-hidden pointer-events-none z-50">
      <!-- Sliding Mint Wave -->
      <div class="nav-loading-bar h-full"></div>
    </div>
  }
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center gap-4">
    <!-- LOGO & BRAND (LEFT) -->
    <div class="flex items-center gap-3 shrink-0">
      <a routerLink="/" class="flex items-center gap-2 group">
        <span
          class="font-caveat tracking-wider text-white text-[28px] h-fit m-0 p-0 group-hover:text-emerald-400 transition-colors cursor-pointer"
        >
          Beatium
        </span>
        <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 tracking-wider">
          LITE
        </span>
      </a>
    </div>

    <!-- PILL NAVIGATION LINKS (CENTER: Overview | Voice | Image | Videos) -->
    <div
      class="hidden md:flex items-center gap-1 bg-playsync-surface border border-playsync-border rounded-full p-1 shadow-inner"
    >
      <!-- Tab 0: Overview -->
      <a
        routerLink="/"
        routerLinkActive="bg-white text-zinc-950 font-bold shadow-md"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-1.5 rounded-full text-xs transition-all duration-200 cursor-pointer flex items-center gap-1.5 text-playsync-muted hover:text-playsync-text"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>
        <span>Overview</span>
      </a>

      <!-- Tab 1: Voice -->
      <a
        routerLink="/voice"
        routerLinkActive="bg-white text-zinc-950 font-bold shadow-md"
        [routerLinkActiveOptions]="{ exact: false }"
        class="px-4 py-1.5 rounded-full text-xs transition-all duration-200 cursor-pointer flex items-center gap-1.5 text-playsync-muted hover:text-playsync-text"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
        </svg>
        <span>Voice</span>
      </a>

      <!-- Tab 2: Image -->
      <a
        routerLink="/image"
        routerLinkActive="bg-white text-zinc-950 font-bold shadow-md"
        [routerLinkActiveOptions]="{ exact: false }"
        class="px-4 py-1.5 rounded-full text-xs transition-all duration-200 cursor-pointer flex items-center gap-1.5 text-playsync-muted hover:text-playsync-text"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span>Image</span>
      </a>

      <!-- Tab 3: Videos -->
      <a
        routerLink="/videos"
        routerLinkActive="bg-white text-zinc-950 font-bold shadow-md"
        [routerLinkActiveOptions]="{ exact: false }"
        class="px-4 py-1.5 rounded-full text-xs transition-all duration-200 cursor-pointer flex items-center gap-1.5 text-playsync-muted hover:text-playsync-text"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 6.75v9a2.25 2.25 0 002.25 2.25z" />
        </svg>
        <span>Videos</span>
        @if (screenService.isSharing()) {
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        }
      </a>
    </div>

    <!-- ACADEMIC BADGE (RIGHT - NO AUTH BUTTONS) -->
    <div class="flex items-center gap-3 shrink-0">
      <span class="hidden sm:inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[11px] font-mono text-zinc-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span>Multimedia Systems Lab</span>
      </span>
    </div>
  </div>
</nav>

<!-- ================= MODERN MOBILE BOTTOM NAVIGATION BAR ================= -->
<nav
  class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-glass-surface/95 backdrop-blur-2xl border-t border-white/8 shadow-[0_-8px_30px_rgba(0,0,0,0.5)] px-3 py-2 flex items-center justify-around select-none"
>
  <!-- 0. Overview -->
  <a
    routerLink="/"
    routerLinkActive="text-white bg-white/10"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all cursor-pointer text-zinc-400"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
    </svg>
    <span class="text-[10px] font-semibold mt-0.5">Overview</span>
  </a>

  <!-- 1. Voice -->
  <a
    routerLink="/voice"
    routerLinkActive="text-white bg-white/10"
    [routerLinkActiveOptions]="{ exact: false }"
    class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all cursor-pointer text-zinc-400"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
    </svg>
    <span class="text-[10px] font-semibold mt-0.5">Voice</span>
  </a>

  <!-- 2. Image -->
  <a
    routerLink="/image"
    routerLinkActive="text-white bg-white/10"
    [routerLinkActiveOptions]="{ exact: false }"
    class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all cursor-pointer text-zinc-400"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
    </svg>
    <span class="text-[10px] font-semibold mt-0.5">Image</span>
  </a>

  <!-- 3. Videos -->
  <a
    routerLink="/videos"
    routerLinkActive="text-white bg-white/10"
    [routerLinkActiveOptions]="{ exact: false }"
    class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all cursor-pointer text-zinc-400 relative"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 6.75v9a2.25 2.25 0 002.25 2.25z" />
    </svg>
    <span class="text-[10px] font-semibold mt-0.5">Videos</span>
    @if (screenService.isSharing()) {
      <span class="absolute top-1.5 right-2.5 w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    }
  </a>
</nav>

<!-- ================= MAIN LAYOUT WITH ROUTER OUTLET ================= -->
<main class="min-h-[calc(100vh-65px)] pb-20 md:pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto flex flex-col pt-6 w-full">
  <router-outlet></router-outlet>
</main>
